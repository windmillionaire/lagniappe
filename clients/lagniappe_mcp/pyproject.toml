[build-system]
requires = ["uv_build==0.12.9"]
build-backend = "uv_build"

[project]
name = "lagniappe-mcp"
version = "0.1.0"
description = "Local MCP adapter for a user's Lagniappe External Agent API"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
authors = [{name = "Lagniappe contributors"}]
keywords = ["lagniappe", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "annotated-types==0.8.0",
  "anyio==4.15.0",
  "attrs==26.1.0",
  "certifi==2026.7.22",
  "cffi==2.1.1",
  "click==8.5.0",
  "cryptography==50.0.1",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpcore2==2.12.0",
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "idna==3.19",
  "jsonschema==4.25.1",
  "jsonschema-specifications==2025.9.1",
  "mcp==2.1.1",
  "mcp-types==2.1.1",
  "opentelemetry-api==1.44.0",
  "pycparser==3.0",
  "pydantic==2.13.5",
  "pydantic-core==2.46.5",
  "pyjwt[crypto]==2.13.0",
  "python-multipart==0.0.32",
  "referencing==0.37.0",
  "rpds-py==2026.6.3",
  "sse-starlette==3.4.10",
  "starlette==1.6.0",
  "truststore==0.10.4",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "uvicorn==0.52.4",
]

[project.urls]
Source = "https://github.com/windmillionaire/lagniappe"
License = "https://github.com/windmillionaire/lagniappe/blob/main/LICENSE"

[project.scripts]
lagniappe-mcp = "lagniappe_mcp.cli:main"

[dependency-groups]
test = [
  "pytest==9.1.1",
  "uv-build==0.12.9",
]

[tool.uv]
required-version = "==0.12.9"
package = true

[tool.uv.build-backend]
module-name = "lagniappe_mcp"
module-root = "src"
