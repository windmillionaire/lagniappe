attributes:
  container:
    classes: flex flex-row items-center gap-2 flex-wrap
    intent: container presentation within attributes
    surfaces: [server]
  button:
    classes: font-semibold pl-2 pr-3 py-2 flex items-center rounded-md gap-1 border text-base-dark bg-white border-base-light/50
    intent: button presentation within attributes
    surfaces: [server]
    css: [src/style/attributes.css, src/style/icons.css]
  icon:
    classes: text-kind-default
    intent: icon presentation within attributes
    surfaces: [server]
    exceptions:
      - diagnostic: duplicate-style-value
        target: icon.default
        reason: attribute glyph color and the general icon color role may evolve separately
  iconStack:
    classes: grid shrink-0
    intent: stable grid stack for the default, add, and remove attribute icons
    surfaces: [server]
    css: [src/style/attributes.css, src/style/icons.css]
  form:
    classes: font-semibold pl-2 pr-3 py-2 flex items-center rounded-md gap-1 outline outline-form-light/70 bg-form-bg/70 text-form-default hover:bg-white hover:outline-form-default focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-form-default data-[selected=false]:opacity-50 data-[selected=true]:bg-white data-[selected=true]:outline-2 data-[selected=true]:outline-form-default
    intent: form switcher with a subtle outline and stronger selected outline
    surfaces: [server]
    css: [src/style/attributes.css]

badge:
  builder:
    classes: ring-kind-light inline-flex items-center gap-1.5 rounded-md bg-white py-1 pr-2.5 pl-2 text-sm/6 font-medium whitespace-nowrap text-base-default ring ring-inset sm:text-xs/5
    intent: builder presentation within badge
    surfaces: [frontend]
  default:
    classes: lp-badge ring-kind-light inline-flex min-w-0 max-w-full items-center gap-1 overflow-hidden rounded-md bg-white py-1 pl-2 pr-2.5 text-sm/6 font-medium whitespace-nowrap text-kind-default ring ring-inset
    intent: reusable compact semantic badge
    surfaces: [server, frontend]
    hooks: [lp-badge]
    css: [src/style/content.css]
  icon:
    classes: icon-base text-kind-default
    intent: icon presentation within badge
    surfaces: [server, frontend]
    hooks: [icon-base]
    css: [src/style/icons.css]

builder:
  view:
    classes: group/builder mx-auto flex max-w-7xl flex-row justify-center gap-8 px-4 pt-4 sm:px-0 sm:pt-6 lg:pt-8
    intent: view presentation within builder
    surfaces: [server]
  component:
    classes: text-md flex cursor-move flex-row items-center gap-3 rounded-md bg-form-bg px-3 py-1.5 font-semibold text-base-dark shadow-sm outline-2 outline-form-default hover:bg-form-light hover:outline-form-dark
    intent: component presentation within builder
    surfaces: [frontend]
  header:
    model:
      classes: h-8 flex flex-row justify-between items-center text-base-dark gap-4 mb-6 text-lg font-bold
      intent: model presentation within builder header
      surfaces: [server]
    side:
      classes: h-8 flex flex-row justify-between items-center text-base-dark gap-4 mb-6 text-lg font-bold
      intent: side presentation within builder header
      surfaces: [server]
      exceptions:
        - diagnostic: duplicate-style-value
          target: builder.header.model
          reason: side and model headings are distinct layout roles that may diverge
  panels:
    model:
      classes: "group/model mb-4 flex min-h-75 flex-col gap-4 rounded-lg p-4 outline-2 outline-form-default outline-dashed"
      intent: model presentation within builder panels
      surfaces: [server]
    default:
      classes: mb-4 flex flex-col gap-4 rounded-lg p-4 outline-2 outline-form-default
      intent: default presentation within builder panels
      surfaces: [server]
    preview:
      classes: outline-2 p-6 rounded-lg flex flex-col gap-6 w-full outline-form-default bg-form-bg
      intent: preview presentation within builder panels
      surfaces: [server]
  name:
    classes: border-b border-dashed focus:outline-none ml-2 w-auto max-w-xs bg-transparent border-base-medium focus:border-form-default
    intent: name presentation within builder
    surfaces: [server]
  switch:
    container:
      classes: "relative inline-flex h-6 w-11 shrink-0 rounded-full border-2 border-form-light bg-form-bg transition-colors ease-in-out focus:outline-none hover:border-form-dark focus-visible:border-form-dark data-[active=true]:border-form-default data-[active=true]:bg-form-default"
      intent: container presentation within builder switch
      surfaces: [server]
    toggle:
      classes: "pointer-events-none h-5 w-5 transform rounded-full bg-white shadow-sm transition duration-200 ease-in-out grid place-items-center group-data-[active=true]/toggle:translate-x-5"
      intent: toggle presentation within builder switch
      surfaces: [server]
  model:
    classes: "form-element rounded-md bg-base-bg p-2 text-sm data-[selected=true]:outline-2 data-[selected=true]:outline-kind-default"
    intent: model presentation within builder
    surfaces: [frontend]
    markers: [form-element]
    css: [src/style/forms.css]
  generate:
    classes: flex grow flex-row items-center gap-3 rounded-md bg-kind-bg px-3 py-1.5 text-base font-semibold text-base-dark shadow-sm outline-2 outline-kind-default hover:bg-kind-light hover:outline-kind-dark
    intent: generate presentation within builder
    surfaces: [server]
  sections:
    side:
      classes: "basis-1/4 group-data-[expanded=true]/builder:hidden"
      intent: side presentation within builder sections
      surfaces: [server]
    main:
      classes: "basis-1/2 justify-self-center group-data-[expanded=true]/builder:basis-2/3"
      intent: main presentation within builder sections
      surfaces: [server]
  settings:
    item:
      classes: group flex flex-row items-center justify-between gap-2
      intent: item presentation within builder settings
      surfaces: [frontend]
    open:
      classes: min-w-0 flex-1 cursor-pointer rounded-md bg-white/50 px-2 py-1 text-left sm:text-sm transition-colors duration-100 hover:bg-white hover:outline-2 hover:outline-form-default focus-visible:bg-white focus-visible:outline-2 focus-visible:outline-form-default focus-visible:outline-offset-0
      intent: compact builder list editor with a two-pixel outline reserved for hover and keyboard focus
      surfaces: [frontend]
    section:
      classes: flex flex-col gap-1 sm:text-sm p-2 rounded-md outline-2 bg-form-bg outline-form-default
      intent: section presentation within builder settings
      surfaces: [frontend]
    title:
      classes: sm:text-sm font-semibold flex justify-between items-center text-base-dark
      intent: title presentation within builder settings
      surfaces: [frontend]
    toggle:
      container:
        classes: "action-icon-button size-5 transition-colors duration-100 disabled:pointer-events-none disabled:opacity-50"
        intent: centered builder settings action using the shared icon-button interaction outline
        surfaces: [frontend]
      icon:
        classes: icon-xs text-kind-default
        intent: icon presentation within builder settings toggle
        surfaces: [frontend]
        hooks: [icon-xs]
        css: [src/style/icons.css]

