  cell:
    default:
      classes: max-w-48 py-3.5 pr-3 text-left font-medium
      intent: default presentation within table cell
      surfaces: [server]
    action:
      classes: w-px py-2.5 text-right text-lg font-medium whitespace-nowrap
      intent: action presentation within table cell
      surfaces: [server]
    compact:
      th:
        classes: group/header w-28 min-w-24 max-w-32 py-2.5 pr-3 text-left font-medium leading-snug whitespace-normal data-[active=false]:border-b-2
