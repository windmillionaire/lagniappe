      surfaces: [frontend]
    actionButton:
      classes: grid size-7 place-items-center rounded-md bg-white text-kind-default outline-offset-0 transition-colors duration-100 hover:text-kind-dark hover:outline-2 hover:outline-kind-default focus-visible:text-kind-dark focus-visible:outline-2 focus-visible:outline-kind-default
