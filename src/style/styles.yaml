  icon:
    classes: "checkbox-icon [grid-area:1/1] pointer-events-none text-white"
    intent: icon presentation within checkbox
    surfaces: [server, frontend]
    hooks: [checkbox-icon]
    css: [src/style/icons.css]
  label:
    classes: flex flex-row items-start gap-2 font-semibold text-base-dark sm:text-sm py-1
    intent: label presentation within checkbox
    surfaces: [server, frontend]
  grid:
    classes: "grid grid-cols-[repeat(auto-fit,minmax(100px,1fr))] lg:grid-cols-[repeat(auto-fit,minmax(140px,1fr))] gap-x-4 gap-y-2 sm:text-sm border-t border-base-medium pt-4"
    intent: grid presentation within checkbox
    surfaces: [frontend]

dropdown:
  menu:
    classes: absolute z-101 flex min-w-37.5 flex-col gap-1 rounded-md bg-white p-1 shadow-lg outline outline-base-light/50
