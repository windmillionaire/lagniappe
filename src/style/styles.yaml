    surfaces: [server]
  description:
    classes: rounded-md px-4 py-3 text-sm flex flex-row items-center w-full slide-right bg-kind-bg empty:hidden mt-4
    intent: description presentation within entity
    surfaces: [server]
    hooks: [slide-right]
    css: [src/style/navigation.css]
  tabIcon:
    classes: relative inline-grid place-items-center text-kind-default hover:text-kind-dark tab-icon outline-none
    intent: consistently sized tab control distinguished by its selected underline
    surfaces: [server]
    css: [src/style/navigation.css, src/style/icons.css]
  name:
    wrapper:
      classes: min-w-0
      intent: shrinkable wrapper that insulates entity-name spacing from surrounding flex gaps
      surfaces: [server, frontend]
    parent:
      classes: whitespace-nowrap
      intent: keeps an entity parent and its breadcrumb separator together
      surfaces: [server, frontend]
    separator:
      classes: mx-1 text-base-medium
      intent: text breadcrumb separator between an entity parent and name
      surfaces: [server, frontend]
    anchor:
      classes: min-w-0
      intent: wrapping anchor for an entity title and its adjacent action menu
      surfaces: [server]
