  icon:
    classes: dropdown-option-icon
    intent: leading icon shared by both inline-flow and action dropdown options
    surfaces: [server, frontend]
    hooks: [dropdown-option-icon]
    css: [src/style/content.css, src/style/icons.css]
  option:
    action:
      classes: dropdown-option dropdown-option-action cursor-default
      intent: flex-aligned command option that supports trailing controls and fixed-size markers
      surfaces: [server, frontend]
      hooks: [dropdown-option, dropdown-option-action]
      css: [src/style/content.css]
    flow:
      classes: dropdown-option dropdown-option-flow cursor-default
      intent: inline-flow result option whose wrapped text can reclaim the leading-icon width
      surfaces: [frontend]
      hooks: [dropdown-option, dropdown-option-flow]
      css: [src/style/content.css]
    multiple:
      classes: dropdown-option-multiple
      intent: flow-style multi-select option with a centered trailing checkbox gutter
      surfaces: [frontend]
      hooks: [dropdown-option-multiple]
      css: [src/style/content.css]
  panel:
    classes: p-1 scrollbar-thin scrollbar-thumb-base-light scrollbar-track-transparent absolute z-50 hidden max-h-96 min-w-64 overflow-y-auto rounded-md bg-white shadow-lg outline outline-base-light/50
    intent: panel presentation within dropdown
    surfaces: [frontend]
  history:
    classes: text-left px-3 py-1.5 rounded-sm hover:bg-base-bg w-full
    intent: history presentation within dropdown
    surfaces: [server]
  search:
    result:
      alias: dropdown.option.flow
      intent: non-navigating inline-flow result within dropdown search
      surfaces: [server, frontend]
      css: [src/style/content.css]
    link:
      classes: dropdown-option dropdown-option-flow cursor-pointer
      intent: navigating inline-flow result within dropdown search
      surfaces: [server, frontend]
      hooks: [dropdown-option, dropdown-option-flow]
      css: [src/style/content.css]
    more:
      classes: dropdown-option dropdown-option-flow font-semibold text-base-default italic
      intent: supplemental inline-flow row within dropdown search
      surfaces: [server]
      hooks: [dropdown-option, dropdown-option-flow]
      css: [src/style/content.css]

