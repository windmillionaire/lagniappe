annotation_scan_roots:
  - installer
  - lagniappe
  - src
  - config

test_scaffold_roots:
  - testing/resources
  - testing/elements

suggestions:
  javascript_generic_symbols:
    - activate
    - active
    - create
    - created
    - deactivate
    - default
    - disable
    - enable
    - error
    - formdata
    - get
    - init
    - load
    - loaded
    - loadwidget
    - open
    - prefetch
    - refresh
    - render
    - route
    - show
    - update
    - updated
    - value
    - visible
  javascript_generic_tokens:
    - active
    - base
    - component
    - create
    - created
    - default
    - disable
    - element
    - enable
    - error
    - form
    - get
    - load
    - open
    - refresh
    - render
    - route
    - show
    - update
    - updated
    - value
    - visible
    - widget
  strong_match_kinds:
    - pair
    - feature
    - dimension
    - path
    - template

exclude:
  - "**/__pycache__/**"
  - "**/*.pyc"
  - "**/*.map"
  - "**/config/**"
  - "**/runner/**"
  - "lagniappe/web/start/styles/**"

python_extensions:
  - ".py"

javascript_extensions:
  - ".mjs"

ignore_symbols:
  names:
    - "__init__"
    - "constructor"
    - "init"
    - "postreconcile"
    - "destroy"
  python_class_bases:
    - "Enum"
  python_data_classes: true
  javascript_method_kinds:
    - "constructor"
    - "get"
    - "set"
