[pytest]
testpaths =
    testing/tests_e2e
    testing/tests_js
    testing/tests_tooling
    testing/tests_unit

filterwarnings =
    error
    ignore:'_UnionGenericAlias' is deprecated

python_files = test_*.py
python_functions = test_*

markers =
    ai: AI-powered tests (uses longer timeouts for model calls)
    e2e: End-to-end tests (full browser/server integration)
    e2e_group(name): Keep this named group on one sequential worker; other groups may run concurrently
    e2e_serial(phase="after"): Run alone; phase="before" reserves setup/reset checks before other batches
    js: JavaScript behavior tests executed in Node without a live browser
    unit: Unit tests (isolated, no external dependencies)
    setup_drift: Opt-in read-only setup provider/API drift probes
    setup_provider: Opt-in sequential live-provider setup/runtime contract tests
    tooling: Tooling/setup/repository-health tests (no app server, no entity setup)
    unfinished: Unfinished tests (skipped by default)

log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)s] %(message)s

# Preserve a useful stack trace if a browser/provider operation stops progressing.
faulthandler_timeout = 180

addopts = -v -m "not unfinished and not setup_drift and not setup_provider" --tb=short --strict-markers
