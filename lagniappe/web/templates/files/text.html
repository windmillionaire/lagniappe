{% macro text_tab(file) %}
  <div id="text"
       lp-component
       data-title="Text Content"
       data-default="TextContent"
       data-tab="true"
       data-visible="false"
       data-kind="file">
    <div data-widget="TextContent"
         data-title="Text Content"
         data-visible="false"
         class="p-4 sm:p-6 border-t border-base-light/50 h-screen overflow-y-auto html-content">
      {% set markup = file.properties.text.markup %}
      {% if markup %}{{ markup|safe_html }}{% endif %}
    </div>
  </div>
{% endmacro %}
