{% macro ingress_tab(file) %}
  <div id="ingress"
       lp-component
       data-title="Data Import"
       data-default="ImportData"
       data-tab="true"
       data-visible="false"
       data-kind="file">{{ ingress(file) }}</div>
{% endmacro %}

{% macro ingress(file) %}
  <div data-widget="ImportData"
       data-title="Import File"
       data-stage="{{ file.stage.name }}"
       data-kind="file"
       data-visible="false"
       class="border-t border-base-light/50 flex flex-row">
    <div data-role="stage"
         class="flex flex-col gap-3 basis-1/3 p-6 border-r border-base-light/50"></div>
    <div data-role="progress"
         class="flex flex-col gap-6 basis-2/3 pt-5 pb-6 px-6 overflow-y-auto min-h-0 max-h-[75vh]"></div>
  </div>
{% endmacro %}
