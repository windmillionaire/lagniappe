{% if not request.headers.get('X-Lagniappe-Request') %}
  {% extends "layouts/stripped.html" %}
{% endif %}

{% block content %}
  <div class="max-w-2xl mx-4 sm:mx-auto mt-6 sm:mt-8 rounded-lg border border-base-light/50 bg-white p-6 sm:p-8 shadow-xs">
    <h1 class="text-2xl font-bold text-base-dark pb-3">

      {% block title %}
      {% endblock title %}
    </h1>
    <p class="text-base-medium leading-relaxed">

      {% block message %}
      {% endblock message %}
    </p>
    <div class="mt-6">
      <a data-kind="page"
         class="action-button inline-flex min-h-9 items-center rounded-md bg-page-default px-4 py-1.5 text-sm font-semibold text-white hover:bg-page-dark focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-page-default"
         href="{{ url_for('home.home_page') }}">Go to Home</a>
    </div>

    {% block traceback %}
    {% endblock traceback %}
  </div>
{% endblock content %}
