{% if not request.headers.get('X-Lagniappe-Request') %}
  {% extends "layouts/stripped.html" %}
{% endif %}

{% block content %}
  <div class="max-w-5xl mx-auto mt-4 sm:mt-6 lg:mt-8">
    <h1 class="text-2xl font-bold pb-4">

      {% block title %}
      {% endblock title %}
    </h1>
    <p>

      {% block message %}
      {% endblock message %}
    </p>

    {% block traceback %}
    {% endblock traceback %}
  </div>
{% endblock content %}
