<!DOCTYPE html>
<html class="h-full bg-white" lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login page">
    <meta name="keywords" content="login, user, access, account">
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="/images/favicon-32x32.png?v={{ CONFIG.BUILD_ID }}">
    <link rel="preload"
          href="/fonts/source-sans-latin.woff2"
          as="font"
          type="font/woff2"
          crossorigin>
    <link rel="preload"
          href="/fonts/source-sans-italic-latin.woff2"
          as="font"
          type="font/woff2"
          crossorigin>
    <link rel="stylesheet" href="/style.css?v={{ CONFIG.BUILD_ID }}">
    <script type="module" src="/login.js?v={{ CONFIG.BUILD_ID }}"></script>
    <title>Logged In</title>
  </head>
  <body id="logged-in">
    <input id="token" type="hidden" value="{{ csrf_token() }}" />
    <div class="flex justify-center mt-24 mb-12">
      <img src="/images/logo-192x192.png?v={{ CONFIG.BUILD_ID }}"
           width="192"
           height="192"
           alt="logo">
    </div>
    <main class="px-4 sm:px-6 lg:px-8">
      <div class="{{ styles.form.login }}">
        <h1 class="{{ styles.login.heading }}">You are logged in</h1>
        <div class="space-y-4 mt-6">
          <a href="{{ url_for('home.home_page') }}"
             data-kind="user"
             class="{{ styles.button.submit }} w-full block text-center">Home</a>
          <button type="button"
                  data-action="logout"
                  data-route="{{ url_for('users.logout') }}"
                  data-kind="user"
                  class="{{ styles.button.submit }} w-full">Logout</button>
        </div>
      </div>
    </main>
  </body>
</html>
