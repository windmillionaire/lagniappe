{% from 'nav.html' import navbar with context %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ description }}">
    <meta name="keywords" content="{{ keywords }}">
    <meta name="mode" content="public">
    <meta name="analytics" content="{{ CONFIG.ANALYTICS|yesno }}">
    <meta name="analytics-action" content="public_view">
    <meta name="analytics-public-id" content="{{ page.public_id }}">
    <meta name="analytics-title" content="{{ page.name }}">
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="/images/apple-touch-icon.png?v={{ CONFIG.BUILD_ID }}">
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="/images/favicon-32x32.png?v={{ CONFIG.BUILD_ID }}">
    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="/images/favicon-16x16.png?v={{ CONFIG.BUILD_ID }}">
    <link rel="stylesheet" href="/style.css?v={{ CONFIG.BUILD_ID }}">
    <script type="module" src="/script.js?v={{ CONFIG.BUILD_ID }}"></script>
    <link rel="preload"
          href="/fonts/source-sans-latin.woff2"
          as="font"
          type="font/woff2"
          crossorigin>
    <link rel="preload"
          href="/fonts/source-sans-italic-latin.woff2"
          as="font"
          type="font/woff2"
          crossorigin>
    <title>

      {% block title %}
        {{ page.name }}
      {% endblock title %}
    </title>
  </head>
  <body class="{{ styles.layout.body }}">
    <input id="token" type="hidden" value="{{ csrf_token() }}" />
    {{ navbar(public=True) }}
    <main id="main"
          class="min-h-full pt-16 pb-16 text-slate-900 px-4 sm:px-6 lg:px-8">
      <div id="content" class="html-content mx-auto max-w-4xl py-6 sm:mt-6">{{ document|safe }}</div>
    </main>
  </body>
</html>
