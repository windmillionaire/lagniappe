{% set view_entry = "messages" %}
{% extends "layouts/base.html" %}

{% block title %}Messages{% endblock title %}

{% block content %}
  <div lp-view
       data-kind="messages"
       data-current-user="{{ current_user.urlsafe_key }}"
       {% if initial_conversation %}data-initial-conversation="{{ initial_conversation }}"{% endif %}
       class="group/view mx-auto max-w-7xl">
    <div class="{{ styles.layout.view.header }}">
      <nav class="{{ styles.layout.view.title }}" data-role="page-header">
        <span data-role="title">Messages</span>
      </nav>
    </div>
    <div id="layout" class="{{ styles.entity.cards }} sm:mt-4">
      <aside data-kind="user"
             class="{{ styles.card.secondary }} overflow-hidden">
        <div class="{{ styles.layout.nav.title }}">
          <span data-role="title">Conversations</span>
          {% if can_message %}
            <button type="button"
                    data-action="compose-message"
                    data-kind="user"
                    aria-label="New message"
                    title="New message"
                    class="{{ styles.toggle.container }}">{{ render_icon("plus") }}</button>
          {% endif %}
        </div>
        <label class="block border-t border-base-light/50 p-4 md:hidden">
          <span class="sr-only">Conversation</span>
          <select data-role="conversation-selector"
                  data-kind="user"
                  class="{{ styles.select.default }}">
            <option value="">Choose a conversation</option>
          </select>
        </label>
        <div data-role="conversation-list"
             class="{{ styles.list.container }} hidden md:block"></div>
        <button type="button"
                data-action="load-conversations"
                class="hidden w-full p-3 text-sm font-medium text-user-default">
          Load older conversations
        </button>
      </aside>
      <section data-kind="user"
               class="{{ styles.card.primary }} flex min-h-[32rem] flex-col overflow-hidden">
        <div data-role="message-header" class="{{ styles.layout.nav.title }}">
          <span class="font-medium">Choose a conversation</span>
        </div>
        <div data-role="message-history"
             class="flex flex-1 flex-col gap-3 overflow-y-auto border-t border-base-light/50 p-4 sm:p-6"
             aria-live="polite"></div>
        <button type="button"
                data-action="load-messages"
                class="hidden self-center p-2 text-sm font-medium text-user-default">
          Load older messages
        </button>
        <form data-role="message-reply"
              data-kind="user"
              class="hidden space-y-3 border-t border-base-light/50 p-4 sm:p-6">
          <label for="message-reply-body" class="sr-only">Reply</label>
          <textarea id="message-reply-body"
                    name="body"
                    data-kind="user"
                    maxlength="1000"
                    required
                    disabled
                    rows="4"
                    class="{{ styles.textarea }} resize-y"></textarea>
          <p data-role="message-reply-error"
             class="hidden text-sm text-delete-default"></p>
          <div class="{{ styles.modal.actions }}">
            <button type="submit"
                    data-kind="user"
                    disabled
                    class="{{ styles.button.submit }}">
              <span data-role="icon" data-visible="false" aria-hidden="true">
                {{ render_icon("spinner") }}
              </span>
              <span data-role="text">Reply</span>
            </button>
          </div>
        </form>
      </section>
    </div>
  </div>
{% endblock content %}
