name: Pull request quality

on:
  pull_request:
    branches:
      - main
      - "next/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source quality and traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PR_BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}

    steps:
      - name: Check out the prospective change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create the project environment
        run: |
          python -m venv venv
          venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check authored frontend source
        run: npm run check

      - name: Check Python source
        run: venv/bin/python -m ruff check .

      - name: Check repository traceability
        run: >-
          venv/bin/python run.py traceability
          --check
          --fail-on warning
          --no-report
          --no-manifest

      - name: Check changed-source test evidence
        run: >-
          venv/bin/python run.py traceability
          --changed "$PR_BASE_REF"
          --check
          --fail-on warning
          --no-report
          --no-manifest

      - name: Check contributor artifact boundaries
        if: github.event_name == 'pull_request' && startsWith(github.base_ref, 'next/')
        run: venv/bin/python run.py pr-check --base "$PR_BASE_REF"

      - name: Check release branch name
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$PR_HEAD_BRANCH" in
            next/*|hotfix/*) ;;
            *)
              echo "Pull requests to main must come from next/* or hotfix/*."
              exit 1
              ;;
          esac

      - name: Check complete release tree
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: venv/bin/python run.py release-check --base "$PR_BASE_REF"
