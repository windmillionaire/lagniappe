name: Pull request quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup-portability:
    name: Setup portability (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        python:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out the prospective change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-setup.txt
            requirements-dev.txt

      - name: Create the project environment
        if: runner.os != 'Windows'
        run: python -m venv venv

      - name: Create the project environment on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: python -m venv venv

      - name: Install portability-test dependencies
        if: runner.os != 'Windows'
        run: >-
          venv/bin/python -m pip install
          --disable-pip-version-check
          -r requirements-setup.txt
          PyYAML==6.0.3
          pytest==9.1.1

      - name: Install portability-test dependencies on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          venv\Scripts\python.exe -m pip install
          --disable-pip-version-check
          -r requirements-setup.txt
          PyYAML==6.0.3
          pytest==9.1.1

      - name: Run mocked install, recovery, deploy, and portability checks
        if: runner.os != 'Windows'
        run: >-
          venv/bin/python run.py test
          testing/tests_tooling/test_001e_setup_orchestration.py::test_default_install_characterization_starts_empty_and_reaches_all_boundaries
          testing/tests_tooling/test_001e_setup_orchestration.py::test_recovery_install_skips_optional_reconfiguration
          testing/tests_tooling/test_001e_setup_orchestration.py::test_setup_python_runtime_gate_precedes_every_cli_mode
          testing/tests_tooling/test_001e_setup_orchestration.py::test_portable_runtime_paths_commands_and_virtualenv_instructions
          testing/tests_tooling/test_001f_setup_portability.py

      - name: Run mocked install, recovery, deploy, and portability checks on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: >-
          venv\Scripts\python.exe run.py test
          testing/tests_tooling/test_001e_setup_orchestration.py::test_default_install_characterization_starts_empty_and_reaches_all_boundaries
          testing/tests_tooling/test_001e_setup_orchestration.py::test_recovery_install_skips_optional_reconfiguration
          testing/tests_tooling/test_001e_setup_orchestration.py::test_setup_python_runtime_gate_precedes_every_cli_mode
          testing/tests_tooling/test_001e_setup_orchestration.py::test_portable_runtime_paths_commands_and_virtualenv_instructions
          testing/tests_tooling/test_001f_setup_portability.py

  quality:
    name: Source quality and traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the prospective change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create the project environment
        run: |
          python -m venv venv
          venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check authored frontend source
        run: npm run check

      - name: Check Python source
        run: venv/bin/python -m ruff check .

      - name: Check repository traceability
        run: >-
          venv/bin/python run.py traceability
          --check
          --fail-on warning
          --no-report
          --no-manifest

      - name: Check changed-source test evidence
        run: >-
          venv/bin/python run.py traceability
          --changed origin/main
          --check
          --fail-on warning
          --no-report
          --no-manifest

      - name: Check contributor artifact boundaries
        run: venv/bin/python run.py pr-check --base origin/main
