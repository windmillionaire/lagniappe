name: Main release

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: main-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Source quality and traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_BASE_REF: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Check release branch
        env:
          RELEASE_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$RELEASE_HEAD_BRANCH" in
            next/*|hotfix/*) ;;
            *)
              echo "Pull requests to main must come from next/* or hotfix/*."
              exit 1
              ;;
          esac

      - name: Check out the prospective release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Create the project environment
        run: |
          python -m venv venv
          venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check authored frontend source
        run: npm run check

      - name: Check Python source
        run: venv/bin/python -m ruff check .

      - name: Check repository traceability
        run: >-
          venv/bin/python run.py traceability
          --check
          --fail-on warning
          --no-report
          --no-manifest

      - name: Check changed-source test evidence
        run: >-
          venv/bin/python run.py traceability
          --changed "$RELEASE_BASE_REF"
          --check
          --fail-on warning
          --no-report
          --no-manifest

      - name: Check complete release tree
        run: venv/bin/python run.py release-check --base "$RELEASE_BASE_REF"
