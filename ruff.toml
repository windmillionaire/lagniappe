target-version = "py314"
line-length = 88

exclude = [
    ".git",
    ".pytest_cache",
    "lagniappe/web/static",
    "mcp/.uv-cache",
    "mcp/.venv",
    "node_modules",
    "reports",
    "venv",
]

[lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM"]
# Existing legacy baseline ignores during EXP-034; new/touched v2.5 code should
# avoid introducing these and clear them as files are touched.
ignore = [
    "B007",
    "B018",
    "B905",
    "SIM102",
    "SIM103",
    "SIM105",
    "SIM108",
    "SIM109",
    "SIM112",
    "SIM114",
    "SIM117",
    "SIM118",
    "SIM201",
    "SIM210",
    "SIM300",
    "SIM905",
    "UP006",
    "UP007",
    "UP012",
    "UP015",
    "UP017",
    "UP034",
    "UP035",
    "UP036",
    "UP037",
    "UP042",
    "UP045",
    "UP047",
]

[lint.per-file-ignores]
"**/__init__.py" = ["E402", "F401"]
"installer/ai_settings.py" = ["E402"]
"installer/deployment.py" = ["E402"]
