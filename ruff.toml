target-version = "py312"
line-length = 88

exclude = [
    ".git",
    ".pytest_cache",
    "lagniappe/web/static",
    "node_modules",
    "reports",
    "venv",
]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"**/__init__.py" = ["E402", "F401"]
"installer/ai_settings.py" = ["E402"]
"installer/deployment.py" = ["E402"]
