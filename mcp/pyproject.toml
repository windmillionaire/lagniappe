[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[project]
name = "lagniappe-mcp"
version = "0.1.6"
description = "Lagniappe remote MCP service"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
authors = [{name = "Lagniappe contributors"}]
keywords = ["lagniappe", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "annotated-types==0.8.0",
  "anyio==4.16.0",
  "attrs==26.1.0",
  "certifi==2026.10.23",
  "cffi==2.1.1",
  "click==8.5.0",
  "cryptography==50.0.2",
  "h11==0.16.0",
  "httpcore==1.0.9",
  "httpcore2==2.16.0",
  "httpx==0.28.1",
  "httpx2==2.16.0",
  "idna==3.20",
  "jsonschema==4.26.0",
  "jsonschema-specifications==2025.9.1",
  "mcp==2.3.0",
  "mcp-types==2.3.0",
  "opentelemetry-api==1.45.2",
  "pycparser==3.12",
  "pydantic==2.14.3",
  "pydantic-core==2.50.4",
  "pyjwt[crypto]==2.15.1",
  "python-multipart==0.0.33",
  "referencing==0.37.0",
  "rpds-py==2026.9.1",
  "sse-starlette==3.6.0",
  "starlette==1.10.0",
  "truststore==0.10.5",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.5",
  "uvicorn==0.54.0",
]

[project.urls]
Source = "https://github.com/windmillionaire/lagniappe"
License = "https://github.com/windmillionaire/lagniappe/blob/main/LICENSE"

[dependency-groups]
test = [
  "pytest==9.2.0",
  "uv-build==0.13.7",
]

[tool.uv]
required-version = "==0.13.7"
package = true

[tool.uv.build-backend]
module-name = "lagniappe_mcp"
module-root = "src"
